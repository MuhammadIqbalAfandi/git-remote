    <title>Forgot Password</title>

  <body>
    <h1>Forgot Password</h1>

    <p>Link reset password will send to email you</p>

    <form method="post">
      <label for="email">Email: </label>
      <input type="text" id="email" name="email" />
      <button type="submit" id="send-email">Send Email</button>
    </form>

    <a href="login.html">Login</a>

    <script>
      const iEmail = document.getElementById('email')
      const bSendEmail = document.getElementById('send-email')

      const sendEmail = (event) => {
        event.preventDefault()

        alert('Link reset password successfully send to email you')
      }

      bSendEmail.addEventListener('click', sendEmail)
    </script>
  </body>
</html>
