<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signup</title>
  </head>
  <body>
    <h1>Singup</h1>

    <form method="post">
      <label for="email">Email: </label>
      <input type="text" id="email" name="email" />
      <label for="password">Password: </label>
      <input type="password" id="password" name="password" />
      <label for="password-confirm">Confirmation Password: </label>
      <input type="password" id="password-confirm" name="password" />
      <button type="submit" id="login">Signup</button>
    </form>

    <a href="login.html">Login</a>

    <script>
      const iEmail = document.getElementById('email')
      const iPassword = document.getElementById('password')
      const iCPassword = document.getElementById('password-confirm')
      const bLogin = document.getElementById('login')

      const login = (event) => {
        event.preventDefault()

        if (iPassword.value === iCPassword.value) {
          alert('Signup Successfully')
        }
      }

      bLogin.addEventListener('click', login)
    </script>
  </body>
</html>
